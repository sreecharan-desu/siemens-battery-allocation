[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "battery-allocation"
version = "1.0.0"
description = "Battery health assessment and dynamic allocation for light EV battery-swapping stations"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Siemens Battery Allocation Team" }]
keywords = ["battery", "ev", "allocation", "siemens", "imece"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.115.0",
    "matplotlib>=3.8.0",
    "pandas>=2.1.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0.0",
    "typer>=0.12.0",
    "uvicorn[standard]>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "mypy>=1.8.0",
    "pandas-stubs>=2.1.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "types-PyYAML>=6.0.0",
]

[project.scripts]
battery-allocation = "battery_allocation.cli.main:run_cli"

[project.urls]
Documentation = "https://github.com/sreecharan-desu/siemens-battery-allocation#readme"
Repository = "https://github.com/sreecharan-desu/siemens-battery-allocation"

[tool.hatch.build.targets.wheel]
packages = ["src/battery_allocation"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["battery_allocation"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["battery_allocation"]
mypy_path = "src"
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["matplotlib.*", "pandas.*", "numpy.*"]
ignore_missing_imports = true
